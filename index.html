      <button type="button" class="icon-btn danger" data-act="delopt" data-i="${i}" aria-label="${tr('delOpt')}">${ICON.x}</button>`;
    row.firstElementChild.value = text;
    list.append(row);
  });
  return el;
}

function renderCategories() {
  stopPreview();
  const list = $('#catList');
  list.textContent = '';
  settings.categories.forEach((cat, i) => list.append(buildCatCard(cat, i)));
  if (!settings.categories.length) {
    const p = document.createElement('p');
    p.className = 'hint';
    p.textContent = tr('catNone');
    list.append(p);
  }
  updateSummaries();
}

/** Aktualisiert Titel + Kurzbeschreibung einer Karte, ohne alles neu zu bauen. */
function refreshCatHead(card, cat) {
  const index = settings.categories.indexOf(cat);
  $('.cat-title', card).textContent = cat.name.trim() || tr('untitled');
  $('.cat-meta', card).textContent = catMetaText(cat, index);
}

/* Klicks innerhalb der Kategorien-Liste */
$('#catList').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const card = btn.closest('.cat');
  const id = card.dataset.id;
  const idx = settings.categories.findIndex((c) => c.id === id);
  const cat = settings.categories[idx];
  if (!cat) return;

  switch (btn.dataset.act) {
    case 'toggle': {
      const open = !openCats.has(id);
      if (open) openCats.add(id); else openCats.delete(id);
      card.classList.toggle('open', open);
      $('.cat-body', card).hidden = !open;
      btn.setAttribute('aria-expanded', open);
      if (!open) stopPreview();
      break;
    }
    case 'up':
    case 'down': {
      const to = btn.dataset.act === 'up' ? idx - 1 : idx + 1;
      if (to < 0 || to >= settings.categories.length) return;
      const [moved] = settings.categories.splice(idx, 1);
      settings.categories.splice(to, 0, moved);
      save();
      renderCategories();
      break;
    }
    case 'delcat':
      deleteCategory(cat);
      break;
    case 'addopt':
      addOption(cat);
      break;
    case 'delopt': {
      const i = Number(btn.dataset.i);
      cat.options.splice(i, 1);
      // Feste Auswahl anpassen, damit sie weiterhin stimmt
      if (cat.result !== 'random') {
        if (cat.result === i) cat.result = 'random';
        else if (cat.result > i) cat.result -= 1;
      }
      save();
      renderCategories();
      break;
    }
    case 'preview':
      runPreview(card, cat, idx);
      break;
  }
});

async function deleteCategory(cat) {
  const ok = await askConfirm(tr('deleteCatAsk', { name: cat.name.trim() || tr('untitled') }), tr('del'), true);
  if (!ok) return;
  const idx = settings.categories.indexOf(cat);
  if (idx < 0) return;
  settings.categories.splice(idx, 1);
  openCats.delete(cat.id);
  save();
  renderCategories();
  toast(tr('catDeleted'));
}

function addOption(cat) {
  cat.options.push('');
  save();
  renderCategories();
  const inputs = $$(`.cat[data-id="${cat.id}"] [data-opt]`);
  if (inputs.length) inputs[inputs.length - 1].focus();
}

/* Tippen in Feldern der Kategorien */
$('#catList').addEventListener('input', (e) => {
  const t = e.target;
  const card = t.closest('.cat');
  if (!card) return;
  const cat = findCat(card.dataset.id);
  if (!cat) return;

  if (t.dataset.f === 'name') {
    cat.name = t.value;
  } else if (t.dataset.f === 'prefix') {
    cat.prefix = t.value;
  } else if (t.dataset.f === 'duration') {
    cat.duration = parseFloat(t.value);
    $('[data-o="duration"]', card).textContent = fmt1(cat.duration) + ' s';
  } else if (t.dataset.f === 'steps') {
    cat.steps = parseInt(t.value, 10);
    $('[data-o="steps"]', card).textContent = cat.steps + '×';
  } else if (t.dataset.opt !== undefined) {
    cat.options[Number(t.dataset.opt)] = t.value;
    fillResultSelect($('[data-f="result"]', card), cat);
  } else {
    return;
  }
  refreshCatHead(card, cat);
  save();
});

$('#catList').addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.f !== 'result') return;
  const card = t.closest('.cat');
  const cat = findCat(card.dataset.id);
  cat.result = t.value === 'random' ? 'random' : Number(t.value);
  refreshCatHead(card, cat);
  save();
});

/* Enter in der letzten Option → neue Option darunter */
$('#catList').addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key !== 'Enter' || t.dataset.opt === undefined) return;
  e.preventDefault();
  const cat = findCat(t.closest('.cat').dataset.id);
  const i = Number(t.dataset.opt);
  if (i === cat.options.length - 1) addOption(cat);
  else {
    const next = $(`.cat[data-id="${cat.id}"] [data-opt="${i + 1}"]`);
    if (next) next.focus();
  }
});

$('#addCat').addEventListener('click', () => {
  const cat = makeCategory(tr('newCat'), '', ['Option 1', 'Option 2', 'Option 3'], 2.5, 18);
  settings.categories.push(cat);
  openCats.add(cat.id);
  save();
  renderCategories();
  const input = $(`.cat[data-id="${cat.id}"] [data-f="name"]`);
  if (input) {
    input.scrollIntoView({ behavior: 'smooth', block: 'center' });
    input.focus();
    input.select();
  }
});

/* Vorschau einer einzelnen Zeile direkt in den Einstellungen */
let preview = null;
function stopPreview() {
  if (preview) preview.cancel();
  preview = null;
}
function runPreview(card, cat, index) {
  Sound.unlock();
  stopPreview();
  const opts = validOptions(cat);
  const box = $('.cat-preview', card);
  if (!opts.length) {
    box.innerHTML = '<span class="pv-empty"></span>';
    $('.pv-empty', box).textContent = tr('noOptions');
    return;
  }
  applyThemeVars(box);
  box.innerHTML = '<span class="row-text"><span class="row-prefix"></span><span class="row-value"></span></span>';
  $('.row-prefix', box).textContent = prefixText(cat);
  const isFinale = index === settings.categories.length - 1;
  preview = rattle({
    rowEl: box,
    valueEl: $('.row-value', box),
    popEl: $('.row-text', box),
    texts: opts.map((o) => o.text),
    finalIndex: pickFinal(cat, opts),
    duration: cat.duration,
    steps: cat.steps,
    isFinale,
    onDone: () => { preview = null; },
  });
}


/* ---------------------------------------------------------------------
   Sound-Einstellungen: Test-Knöpfe & eigene Dateien
   --------------------------------------------------------------------- */
function updateSoundUI() {
  SOUND_TYPES.forEach(({ key }) => {
    const c = Sound.custom[key];
    const info = $(`[data-info="${key}"]`);
    const removeBtn = $(`[data-remove="${key}"]`);
    const select = $(`select[data-setting="sound.${key}"]`);
    if (!info) return;
    info.textContent = c ? '🎵 ' + c.name + (c.sessionOnly ? tr('sessionOnly') : '') : '';
    removeBtn.hidden = !c;
    select.disabled = !!c;
  });
}

$('#soundRows').addEventListener('click', (e) => {
  const test = e.target.closest('[data-test]');
  const remove = e.target.closest('[data-remove]');
  if (test) {
    Sound.unlock();
    const type = test.dataset.test;
    if (type === 'tick') {
      // Mehrere Ticks, die langsamer werden – so hört man den Effekt
      buildTimes(10, 1100).forEach((t) => setTimeout(() => Sound.play('tick', true), t));
    } else {
      Sound.play(type, true);
    }
  }
  if (remove) {
    Sound.removeCustom(remove.dataset.remove);
    updateSoundUI();
    toast(tr('soundRemoved'));
  }
});

$('#soundRows').addEventListener('change', async (e) => {
  const input = e.target.closest('input[type="file"]');
  if (!input) return;
  const type = input.dataset.file;
  const file = input.files && input.files[0];
  input.value = ''; // damit dieselbe Datei später erneut gewählt werden kann
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast(tr('fileTooBig')); return; }

  try {
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const ctx = Sound.ensure();
    if (!ctx) { toast(tr('noAudio')); return; }
    const buffer = await decodeAudio(ctx, dataUrlToArrayBuffer(dataUrl));
    const stored = Store.set(KEYS.sound(type), { name: file.name, dataUrl });
    Sound.custom[type] = { name: file.name, dataUrl, buffer, sessionOnly: !stored };
    updateSoundUI();
    toast(tr(stored ? 'soundSaved' : 'soundSession'));
  } catch (err) {
    toast(tr('soundBad'));
  }
});


/* =====================================================================
   9) PRESETS (gespeicherte Einstellungen unter einem Namen)
   ===================================================================== */
let presets = loadPresets();
let activePreset = Store.get(KEYS.active, null);

function loadPresets() {
  return cleanPresets(Store.get(KEYS.presets, []));
}
function cleanPresets(list) {
  return Array.isArray(list)
    ? list.filter((p) => p && typeof p.name === 'string' && p.settings && typeof p.settings === 'object')
    : [];
}
function savePresets() {
  meta.presetsAt = Date.now();
  const ok = Store.set(KEYS.presets, presets) && Store.set(KEYS.meta, meta);
  if (!ok) toast(tr('presetSaveFail'));
  Cloud.push('presets');
}
function setActivePreset(name) {
  activePreset = name;
  if (name) Store.set(KEYS.active, name); else Store.remove(KEYS.active);
}

/** Gibt es Änderungen, die noch in keinem Preset gespeichert sind? */
function hasUnsavedChanges() {
  const current = JSON.stringify(settings);
  const p = presets.find((x) => x.name === activePreset);
  if (p && JSON.stringify(normalizeSettings(deepCopy(p.settings))) === current) return false;
  const def = defaultSettings(settings.lang);
  // Standardwerte gelten nicht als „ungespeichert" (IDs ignorieren)
  const strip = (s) => JSON.stringify({ ...s, categories: s.categories.map(({ id, ...rest }) => rest) });
  return strip(settings) !== strip(def);
}

function updatePresetStatus() {
  const el = $('#presetActive');
  if (!el) return;
  const p = presets.find((x) => x.name === activePreset);
  if (p) {
    const changed = JSON.stringify(normalizeSettings(deepCopy(p.settings))) !== JSON.stringify(settings);
    el.textContent = tr('presetLoaded', { name: p.name }) + (changed ? tr('presetChanged') : '');
    $('#presetSum').textContent = p.name + (changed ? ' *' : '');
  } else {
    el.textContent = tr('presetIntro');
    $('#presetSum').textContent = presets.length ? tr('presetCount', { n: presets.length }) : '';
  }
}

function renderPresets() {
  const ul = $('#presetList');
  ul.textContent = '';
  presets.forEach((p, i) => {
    const li = document.createElement('li');
    const date = new Date(p.savedAt || Date.now());
    li.innerHTML = `
      <span class="preset-name"><b></b><small></small></span>
      <button type="button" class="btn" data-load="${i}">${tr('load')}</button>
      <button type="button" class="btn danger" data-del="${i}" aria-label="${tr('presetDeleteAria')}">${ICON.trash}</button>`;
    $('b', li).textContent = p.name;
    if (p.name === activePreset) {
      const badge = document.createElement('span');
      badge.className = 'active-badge';
      badge.textContent = tr('active');
      $('b', li).append(badge);
    }
    const en = settings.lang === 'en';
    $('small', li).textContent = tr('savedAt', {
      date: en ? date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : date.toLocaleDateString('de-DE'),
      time: date.toLocaleTimeString(en ? 'en-US' : 'de-DE', { hour: '2-digit', minute: '2-digit' }),
    });
    ul.append(li);
  });
  $('#presetEmpty').hidden = presets.length > 0;
  updatePresetStatus();
}

$('#presetSave').addEventListener('click', async () => {
  const input = $('#presetName');
  const name = input.value.trim();
  if (!name) { toast(tr('presetNeedName')); input.focus(); return; }
  let existing = presets.findIndex((p) => p.name.toLowerCase() === name.toLowerCase());
  if (existing >= 0 &&
      !(await askConfirm(tr('presetOverwrite', { name: presets[existing].name }), tr('overwrite')))) return;
  existing = presets.findIndex((p) => p.name.toLowerCase() === name.toLowerCase());

  const entry = { name, settings: deepCopy(settings), savedAt: Date.now() };
  if (existing >= 0) presets[existing] = entry; else presets.unshift(entry);
  savePresets();
  setActivePreset(name);
  input.value = '';
  input.blur();
  renderPresets();
  toast(tr('presetSaved', { name }));
});
$('#presetName').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); $('#presetSave').click(); }
});

$('#presetList').addEventListener('click', async (e) => {
  const loadBtn = e.target.closest('[data-load]');
  const delBtn = e.target.closest('[data-del]');
  if (loadBtn) {
    const p = presets[Number(loadBtn.dataset.load)];
    if (!p) return;
    if (p.name !== activePreset && hasUnsavedChanges() &&
        !(await askConfirm(tr('presetLoadAsk', { name: p.name }), tr('load')))) return;
    settings = normalizeSettings(deepCopy(p.settings));
    setActivePreset(p.name);
    openCats.clear();
    save();
    saveNow();
    refreshAll();
    toast(tr('presetLoadedToast', { name: p.name }));
  }
  if (delBtn) {
    const p = presets[Number(delBtn.dataset.del)];
    if (!p || !(await askConfirm(tr('presetDeleteAsk', { name: p.name }), tr('del'), true))) return;
    const i = presets.indexOf(p);
    if (i < 0) return;
    presets.splice(i, 1);
    if (p.name === activePreset) setActivePreset(null);
    savePresets();
    renderPresets();
    toast(tr('presetDeleted'));
  }
});


/* =====================================================================
   10) ABGLEICH ZWISCHEN DEINEN GERÄTEN (iPhone ↔ iPad)
       Funktioniert nur in der veröffentlichten Version auf claude.ai.
       Öffnest du die Datei direkt, bleibt alles nur auf diesem Gerät.
       Regel: Der zuletzt geänderte Stand gewinnt.
   ===================================================================== */
const Cloud = {
  ready: false,
  waiting: false,  // Abgleich steht aus, weil gerade der Video-Modus läuft
  refs: {},        // { settings, presets } – je ein Dokument nur für dich
  timers: {},
  busy: {},
  again: {},
  warned: false,

  async init() {
    if (!window.claude || typeof window.claude.use !== 'function') return; // einzelne Datei
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const mine = db.collection('data/users/' + id); // privater Bereich, nur für dich
      this.refs = { settings: mine.doc('settings'), presets: mine.doc('presets') };
      this.ready = true;
      await this.pull();
    } catch (e) {
      console.warn('Abgleich nicht verfügbar', e);
    }
  },

  /** Holt den Stand vom anderen Gerät; der neuere Stand gewinnt. */
  async pull() {
    if (!this.ready) return;
    if (inVideo) { this.waiting = true; return; } // nicht mitten beim Filmen umbauen
    this.waiting = false;
    try {
      const [s, p] = await Promise.all([this.refs.settings.get(), this.refs.presets.get()]);
      const remoteS = s.exists ? s.data() : null;
      const remoteP = p.exists ? p.data() : null;
      const remoteSAt = remoteS ? Number(remoteS.savedAt) || 0 : 0;
      const remotePAt = remoteP ? Number(remoteP.savedAt) || 0 : 0;
      let changed = false;

      if (remoteS && remoteS.settings && remoteSAt > meta.settingsAt && !settingsDirty) {
        settings = normalizeSettings(deepCopy(remoteS.settings));
        meta.settingsAt = remoteSAt;
        Store.set(KEYS.settings, settings);
        changed = true;
      } else if (meta.settingsAt > remoteSAt) {
        this.push('settings', 0);
      }

      if (remoteP && Array.isArray(remoteP.presets) && remotePAt > meta.presetsAt) {
        presets = cleanPresets(deepCopy(remoteP.presets));
        meta.presetsAt = remotePAt;
        Store.set(KEYS.presets, presets);
        changed = true;
      } else if (meta.presetsAt > remotePAt) {
        this.push('presets', 0);
      }

      if (changed) {
        Store.set(KEYS.meta, meta);
        refreshAll();
      }
      this.note('syncOk');
    } catch (e) {
      this.note('syncFail');
    }
  },

  /** Schickt eine Änderung (kurz verzögert) an deine anderen Geräte. */
  push(kind, delay = 1200) {
    if (!this.ready) return;
    clearTimeout(this.timers[kind]);
    this.timers[kind] = setTimeout(() => { this.timers[kind] = 0; this.write(kind); }, delay);
  },

  /** Ausstehende Änderungen sofort senden (z. B. beim Verlassen der App). */
  flush() {
    Object.keys(this.timers).forEach((kind) => {
      if (this.timers[kind]) { clearTimeout(this.timers[kind]); this.timers[kind] = 0; this.write(kind); }
    });
  },

  async write(kind, retried = false) {
    if (!this.ready) return;
    if (this.busy[kind]) { this.again[kind] = true; return; } // immer nur ein Schreibvorgang gleichzeitig
    this.busy[kind] = true;
    try {
      const body = kind === 'settings'
        ? { savedAt: meta.settingsAt, settings: deepCopy(settings) }
        : { savedAt: meta.presetsAt, presets: deepCopy(presets) };
      await this.refs[kind].set(body);
    } catch (e) {
      if (e && e.code === 'unavailable' && !retried) {
        this.busy[kind] = false;
        setTimeout(() => this.write(kind, true), 800 + Math.random() * 1200);
        return;
      }
      if (!this.warned) {
        this.warned = true;
        toast(tr('syncWriteFail'));
      }
    } finally {
      this.busy[kind] = false;
    }
    if (this.again[kind]) { this.again[kind] = false; this.write(kind); }
  },

  note(key) {
    const el = $('#syncNote');
    el.dataset.i18n = key;       // wird beim Sprachwechsel automatisch übersetzt
    el.textContent = tr(key);
    el.hidden = false;
  },
};

/* App kommt wieder in den Vordergrund → neuesten Stand holen.
   App geht in den Hintergrund → alles sofort speichern und senden. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') Cloud.pull();
  else { saveNow(); Cloud.flush(); }
});
window.addEventListener('pagehide', () => Cloud.flush());

/** Setzt alle Texte der Seite in der gewählten Sprache ein. */
function applyLanguage() {
  document.documentElement.lang = settings.lang;
  $$('[data-i18n]').forEach((el) => { el.textContent = tr(el.dataset.i18n); });
  $$('[data-i18n-html]').forEach((el) => { el.innerHTML = tr(el.dataset.i18nHtml); }); // nur eigene Texte aus I18N
  $$('[data-i18n-ph]').forEach((el) => { el.placeholder = tr(el.dataset.i18nPh); });
  $$('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', tr(el.dataset.i18nAria)); });
  $$('#soundRows select option').forEach((o) => { o.textContent = tr('var_' + o.value); });
}

/** Übersetzt Standard-Texte und Standard-Kategorien von einer Sprache in
    die andere. Was du selbst geschrieben hast, bleibt unverändert. */
function translateDefaults(from, to) {
  ['title', 'startText', 'againText'].forEach((k) => {
    if (settings[k].trim() === DEFAULT_TEXTS[from][k]) settings[k] = DEFAULT_TEXTS[to][k];
  });
  const A = DEFAULT_CATS[from];
  const B = DEFAULT_CATS[to];
  settings.categories.forEach((cat) => {
    if (cat.name.trim() === I18N[from].newCat) cat.name = I18N[to].newCat;
    // Passende Standard-Kategorie finden: über den Namen, den Text davor
    // oder (mind. 4 Optionen) wenn alle Optionen Standard-Optionen sind
    let j = A.findIndex((d) => d.name === cat.name.trim());
    if (j < 0) j = A.findIndex((d) => d.prefix && d.prefix === cat.prefix.trim());
    if (j < 0) {
      const filled = cat.options.map((o) => o.trim()).filter(Boolean);
      j = A.findIndex((d) => filled.length >= 4 && filled.every((o) => d.options.includes(o)));
    }
    if (j < 0) return;
    if (cat.name.trim() === A[j].name) cat.name = B[j].name;
    if (cat.prefix.trim() === A[j].prefix) cat.prefix = B[j].prefix;
    cat.options = cat.options.map((o) => {
      const k = A[j].options.indexOf(o.trim());
      return k >= 0 ? B[j].options[k] : o;
    });
  });
}

/** Wird beim Tippen auf DE / EN aufgerufen. */
function switchLanguage(to) {
  if (!I18N[to] || to === settings.lang) return;
  const from = settings.lang;
  settings.lang = to;
  translateDefaults(from, to);
  save();
  refreshAll();
  toast(tr('langSwitched'));
}

function refreshAll() {
  applyLanguage();
  syncGlobalControls();
  renderCategories();
  renderPresets();
  Sound.applyVolume();
}

// Start: Bedienelemente aufbauen und mit den Einstellungen füllen
buildThemeSwatches();
buildSoundRows();
bindGlobalControls();
Sound.loadCustomsFromStorage();
refreshAll();
Cloud.init(); // Abgleich zwischen Geräten (nur in der veröffentlichten Version)
